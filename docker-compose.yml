services:
  app:
    build:
      context: .
      args:
        # Set by scripts/compose.sh from .nvmrc; there is no default on purpose,
        # so a stale version can never be baked in silently.
        NODE_VERSION: ${NODE_VERSION:?run docker compose through npm run docker:* so the version is read from .nvmrc}
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      # MCP calls are made server-side, so the MCP poisoning challenge needs a
      # way to reach the attacker server the player runs on the host.
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env.local
        required: false
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - NEXT_PUBLIC_BASE_URL=http://localhost:3000
    volumes:
      - oss-data:/app/data
      - oss-uploads:/app/uploads
      - oss-documents:/app/documents
    restart: unless-stopped

volumes:
  oss-data:
  oss-uploads:
  oss-documents:
