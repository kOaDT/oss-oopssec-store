name: Docker Build

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".nvmrc"
      - "docker-compose.yml"
      - "docker-entrypoint.sh"
      - "package*.json"
      - "prisma/**"
      - "app/**"
      - "lib/**"
      - "public/**"
      - "hooks/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: docker build -t oss-oopssec-store:test .

      # Offline, so a package missing from the image fails here instead of
      # being fetched from the registry at startup.
      - name: Smoke test the image offline
        timeout-minutes: 5
        run: |
          docker run -d --name smoke --network none oss-oopssec-store:test
          until docker logs smoke 2>&1 | grep -F "Database initialized successfully." >/dev/null; do
            [ "$(docker inspect -f '{{.State.Running}}' smoke)" = true ] || exit 1
            sleep 2
          done
          until docker exec smoke wget -qO- http://127.0.0.1:3000/api/flags/count; do
            [ "$(docker inspect -f '{{.State.Running}}' smoke)" = true ] || exit 1
            sleep 2
          done

      - name: Show container logs
        if: failure()
        run: docker logs smoke
