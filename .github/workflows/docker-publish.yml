name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    uses: docker/github-builder/.github/workflows/build.yml@cbc9d42f8c89a55623392aadd03600965b80e963 # v1.18.1
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      # The secrets context is unavailable in a reusable workflow's `with:`.
      meta-images: leogra/oss-oopssec-store
      # A release pushes its tag as is, plus `latest`. A manual run pushes a
      # throwaway tag and never moves `latest`, even when dispatched on a tag.
      meta-tags: |
        type=ref,event=tag,enable=${{ github.event_name == 'release' }}
        type=raw,value=test-${{ github.run_id }},enable=${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
